<body data-page="certificados" data-path="~/certificados">
  <a class="skip-link" href="#main">Pular para o conteúdo</a>
  <noscript>
    <nav style="padding:16px;font-family:monospace">
      <a href="index.html">home</a> | <a href="sobre.html">sobre</a> | <a href="projetos.html">projetos</a> | <a href="certificados.html">certificados</a> | <a href="contato.html">contato</a>
    </nav>
  </noscript>

  <main class="page" id="main" tabindex="-1">
    <div class="term">
      <div class="reveal" aria-hidden="true">
        <div class="term-line">
          <span class="prompt-user">daniel</span><span class="prompt-at">@</span><span class="prompt-host">portfolio</span><span class="prompt-colon">:</span><span class="prompt-path">~</span><span class="prompt-sign-prompt">$</span>
          <span class="cmd">ls ./certificados/ --group-by=categoria</span><span class="cursor"></span>
        </div>
      </div>
      <div class="sep-line" aria-hidden="true"><span class="text-muted"># ============================================</span></div>

      <section aria-label="Filtros de certificados">
        <div class="cert-filters reveal">
          <button class="filter-btn active" data-filter="all">todos</button>
          <button class="filter-btn" data-filter="backend">backend</button>
          <button class="filter-btn" data-filter="frontend">frontend</button>
        </div>
        <div class="cert-tools reveal">
          <label class="sr-only" for="certSearch">Buscar certificados</label>
          <input type="search" id="certSearch" placeholder="buscar..." autocomplete="off">
          <label class="sr-only" for="certIssuer">Emissor</label>
          <select id="certIssuer"><option value="all">todos emissores</option></select>
          <label class="sr-only" for="certSort">Ordenar por data</label>
          <select id="certSort"><option value="desc">mais recentes</option><option value="asc">mais antigos</option></select>
        </div>
        <div class="cert-count reveal" id="certCount" role="status" aria-live="polite"></div>
      </section>

      <section aria-label="Lista de certificados">
        <div id="certList"></div>
      </section>
    </div>
  </main>

  <script src="js/certs-data.js" defer></script>
  <script src="js/modules/certs.js" defer></script>
  <script src="js/main.js" defer></script>
  <script>if ('serviceWorker' in navigator && location.protocol === 'https:') window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });</script>
</body>
</html>
